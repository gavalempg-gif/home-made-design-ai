<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Made Design AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 12px;
      color: #333;
    }
    .container {
      background: white;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 22px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
    }
    .lang-switch {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 5px 10px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      border-radius: 16px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .logo { font-size: 2.4rem; margin-bottom: 6px; }
    h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { font-size: 0.92rem; color: #555; margin-bottom: 18px; }
    .upload-box {
      border: 2px dashed #667eea;
      border-radius: 14px;
      padding: 28px 12px;
      background: #f8f9ff;
      margin-bottom: 15px;
      cursor: pointer;
    }
    .upload-box:hover { background: #eef0ff; }
    .upload-icon { font-size: 2.2rem; }
    .upload-box p { font-size: 0.9rem; color: #555; margin-top: 6px; }
    input[type="file"] { display: none; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .preview { margin-top: 15px; display: none; }
    .preview img { max-width: 100%; border-radius: 12px; margin-bottom: 10px; }
    .questions {
      display: none;
      text-align: left;
      margin-top: 20px;
    }
    .questions h3 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.15rem;
      color: #1a1a2e;
    }
    .q-box {
      margin-bottom: 14px;
    }
    .q-box label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .q-box select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .result {
      display: none;
      margin-top: 20px;
    }
    .result img {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .loading {
      display: none;
      margin: 20px 0;
      font-size: 1rem;
      color: #667eea;
    }
    .note { margin-top: 15px; font-size: 0.8rem; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="changeLang('gu')">ગુજ</button>
      <button class="lang-btn" onclick="changeLang('hi')">हिंदी</button>
      <button class="lang-btn" onclick="changeLang('en')">EN</button>
    </div>

    <div class="logo">🏠</div>
    <h1 id="title">Home Made Design AI</h1>
    <p class="subtitle" id="subtitle">Layout અથવા Photo અપલોડ કરો</p>

    <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📤</div>
      <p id="uploadText">ફોટો અથવા Layout અહીં ક્લિક કરીને અપલોડ કરો</p>
      <p style="font-size: 0.8rem; color: #888;" id="supportText">JPG, PNG સપોર્ટેડ</p>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="showPreview(event)">

    <div class="preview" id="previewArea">
      <img id="previewImage" src="" alt="Preview">
      <button class="btn" id="nextBtn" onclick="showQuestions()">Next → AI Agent</button>
    </div>

    <div class="questions" id="questionsArea">
      <h3 id="qTitle">AI Agent - તમારી પસંદગી</h3>

      <div class="q-box">
        <label id="q1">૧. કયો રૂમ છે?</label>
        <select id="roomType">
          <option value="living room">Living Room</option>
          <option value="bedroom">Bedroom</option>
          <option value="kitchen">Kitchen</option>
          <option value="bathroom">Bathroom</option>
          <option value="office">Office / Study</option>
        </select>
      </div>

      <div class="q-box">
        <label id="q2">૨. Style કયો ગમે?</label>
        <select id="styleType">
          <option value="modern">Modern</option>
          <option value="traditional Gujarati">Traditional / Gujarati</option>
          <option value="minimal">Minimal</option>
          <option value="luxury">Luxury</option>
          <option value="scandinavian">Scandinavian</option>
        </select>
      </div>

      <div class="q-box">
        <label id="q3">૩. Wall Color Preference?</label>
        <select id="wallColor">
          <option value="white">White / Off-white</option>
          <option value="beige">Beige / Cream</option>
          <option value="grey">Grey</option>
          <option value="light blue">Light Blue</option>
          <option value="light green">Light Green</option>
        </select>
      </div>

      <div class="q-box">
        <label id="q4">૪. Furniture Style?</label>
        <select id="furniture">
          <option value="modern">Modern</option>
          <option value="wooden traditional">Wooden / Traditional</option>
          <option value="minimal">Minimal</option>
          <option value="luxury">Luxury</option>
        </select>
      </div>

      <div class="q-box">
        <label id="q5">૫. Lighting?</label>
        <select id="lighting">
          <option value="warm cozy">Warm / Cozy</option>
          <option value="natural daylight">Natural Daylight</option>
          <option value="cool white">Cool White</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>

      <button class="btn" id="generateBtn" onclick="startGenerate()">Generate Design Image</button>
      <div class="loading" id="loadingText">Generating... Please wait 20-40 seconds</div>
    </div>

    <div class="result" id="resultArea">
      <h3>Your Designed Image</h3>
      <img id="resultImage" src="" alt="Generated Design">
      <button class="btn" onclick="location.reload()">Generate New</button>
    </div>

    <p class="note" id="noteText">AI powered by Fal.ai + Gemini</p>
  </div>

  <script>
    const texts = {
      gu: {
        title: "Home Made Design AI",
        subtitle: "Layout અથવા Photo અપલોડ કરો",
        uploadText: "ફોટો અથવા Layout અહીં ક્લિક કરીને અપલોડ કરો",
        supportText: "JPG, PNG સપોર્ટેડ",
        next: "Next → AI Agent",
        qTitle: "AI Agent - તમારી પસંદગી",
        q1: "૧. કયો રૂમ છે?",
        q2: "૨. Style કયો ગમે?",
        q3: "૩. Wall Color Preference?",
        q4: "૪. Furniture Style?",
        q5: "૫. Lighting?",
        generate: "Generate Design Image",
        loading: "Generating... Please wait 20-40 seconds",
        note: "AI powered by Fal.ai + Gemini"
      },
      hi: {
        title: "Home Made Design AI",
        subtitle: "लेआउट या फोटो अपलोड करें",
        uploadText: "फोटो या लेआउट यहाँ क्लिक करके अपलोड करें",
        supportText: "JPG, PNG सपोर्टेड",
        next: "आगे → AI Agent",
        qTitle: "AI Agent - आपकी पसंद",
        q1: "१. कौन सा कमरा है?",
        q2: "२. स्टाइल कौन सा पसंद है?",
        q3: "३. दीवार का रंग?",
        q4: "४. फर्नीचर स्टाइल?",
        q5: "५. लाइटिंग?",
        generate: "डिज़ाइन इमेज जनरेट करें",
        loading: "जनरेट हो रहा है... 20-40 सेकंड प्रतीक्षा करें",
        note: "AI powered by Fal.ai + Gemini"
      },
      en: {
        title: "Home Made Design AI",
        subtitle: "Upload Layout or Photo",
        uploadText: "Click here to upload Photo or Layout",
        supportText: "JPG, PNG supported",
        next: "Next → AI Agent",
        qTitle: "AI Agent - Your Preferences",
        q1: "1. Which room is this?",
        q2: "2. Preferred Style?",
        q3: "3. Wall Color Preference?",
        q4: "4. Furniture Style?",
        q5: "5. Lighting?",
        generate: "Generate Design Image",
        loading: "Generating... Please wait 20-40 seconds",
        note: "AI powered by Fal.ai + Gemini"
      }
    };

    let currentLang = 'gu';

    function changeLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      const t = texts[lang];
      document.getElementById('title').innerText = t.title;
      document.getElementById('subtitle').innerText = t.subtitle;
      document.getElementById('uploadText').innerText = t.uploadText;
      document.getElementById('supportText').innerText = t.supportText;
      document.getElementById('nextBtn').innerText = t.next;
      document.getElementById('qTitle').innerText = t.qTitle;
      document.getElementById('q1').innerText = t.q1;
      document.getElementById('q2').innerText = t.q2;
      document.getElementById('q3').innerText = t.q3;
      document.getElementById('q4').innerText = t.q4;
      document.getElementById('q5').innerText = t.q5;
      document.getElementById('generateBtn').innerText = t.generate;
      document.getElementById('loadingText').innerText = t.loading;
      document.getElementById('noteText').innerText = t.note;
    }

    function showPreview(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewImage').src = e.target.result;
          document.getElementById('previewArea').style.display = 'block';
          document.getElementById('uploadBox').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    function showQuestions() {
      document.getElementById('previewArea').style.display = 'none';
      document.getElementById('questionsArea').style.display = 'block';
      document.getElementById('subtitle').style.display = 'none';
    }

    async function startGenerate() {
      const room = document.getElementById('roomType').value;
      const style = document.getElementById('styleType').value;
      const color = document.getElementById('wallColor').value;
      const furniture = document.getElementById('furniture').value;
      const lighting = document.getElementById('lighting').value;

      const btn = document.getElementById('generateBtn');
      const loading = document.getElementById('loadingText');

      btn.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            room: room,
            style: style,
            color: color,
            furniture: furniture,
            lighting: lighting
          })
        });

        const data = await response.json();

        if (data.success && data.imageUrl) {
          document.getElementById('resultImage').src = data.imageUrl;
          document.getElementById('questionsArea').style.display = 'none';
          document.getElementById('resultArea').style.display = 'block';
        } else {
          alert('Error: ' + (data.error || 'Generation failed'));
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }

      btn.disabled = false;
      loading.style.display = 'none';
    }
  </script>
</body>
</html>

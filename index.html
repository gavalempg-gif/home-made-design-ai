<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Made Design AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px 15px;
      color: #333;
    }
    .container {
      background: white;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
      text-align: center;
    }
    .logo {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 1rem;
      color: #555;
      margin-bottom: 25px;
    }
    .upload-box {
      border: 2px dashed #667eea;
      border-radius: 16px;
      padding: 35px 20px;
      background: #f8f9ff;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-box:hover {
      background: #eef0ff;
      border-color: #764ba2;
    }
    .upload-box p {
      font-size: 1rem;
      color: #555;
      margin-top: 10px;
    }
    .upload-icon {
      font-size: 2.5rem;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .preview {
      margin-top: 20px;
      display: none;
    }
    .preview img {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🏠</div>
    <h1>Home Made Design AI</h1>
    <p class="subtitle">Layout અથવા Photo અપલોડ કરો</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📤</div>
      <p>ફોટો અથવા Layout અહીં ક્લિક કરીને અપલોડ કરો</p>
      <p style="font-size: 0.85rem; color: #888;">JPG, PNG સપોર્ટેડ</p>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="showPreview(event)">

    <div class="preview" id="previewArea">
      <img id="previewImage" src="" alt="Preview">
      <button class="btn" id="generateBtn" onclick="startGenerate()">Generate Design</button>
    </div>

    <p class="note">AI Agent + Image Generation જલ્દી કનેક્ટ થશે</p>
  </div>

  <script>
    function showPreview(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewImage').src = e.target.result;
          document.getElementById('previewArea').style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    function startGenerate() {
      alert("Generate ફીચર હજુ કનેક્ટ થયું નથી.\nઆગળના સ્ટેપમાં AI API જોડીશું.");
    }
  </script>
</body>
</html>

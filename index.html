<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Made Design AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      max-width: 520px;
      width: 90%;
      padding: 50px 35px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
      text-align: center;
    }
    .logo {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 1.05rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .features {
      margin: 28px 0;
      text-align: left;
      background: #f8f9ff;
      padding: 20px 24px;
      border-radius: 16px;
    }
    .features p {
      font-size: 0.95rem;
      color: #444;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 16px 42px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .note {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🏠</div>
    <h1>Home Made Design AI</h1>
    <p class="subtitle">Layout અથવા Photo પરથી સુંદર Design Image બનાવો</p>
    
    <div class="features">
      <p>🎨 Wall Paint & Color Combination</p>
      <p>🛋️ Furniture & Decoration</p>
      <p>💡 Lighting Effects</p>
      <p>📐 High Quality 2x / 4x Options</p>
    </div>

    <a href="#" class="btn">Coming Soon</a>
    <p class="note">AI Agent + Image Generation જલ્દી આવશે</p>
  </div>
</body>
</html>
